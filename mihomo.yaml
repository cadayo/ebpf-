mode: rule
ipv6: false
log-level: error
allow-lan: true
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 30
external-controller: 127.0.0.1:8888
external-ui: /data/data/com.termux/files/home/mihomo/ui
#external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"

find-process-mode: always
client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true
  
sniffer:
  enable: true
  force-dns-mapping: true
  override-destination: true
  sniff:
    HTTP:
      ports: [0, 65535]
    TLS:
      ports: [0, 65535]
    QUIC:
      ports: [0, 65535]

hosts:
  dns.google: [8.8.8.8, 8.8.4.4, 2001:4860:4860::8888, 2001:4860:4860::8844]
  dns.alidns.com": [223.5.5.5, 223.6.6.6, 2400:3200::1, 2400:3200:baba::1]

listeners:
  - name: ebpf-inbound
    type: ebpf
    mode: local
    network: [tcp, udp]
    dns-mode: hijack
    udp-timeout: 300
    local:
      ipv6-mode: auto
      state-capacity: 65536



dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/15
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,xiaomi_domain,real-ip
    - RULE-SET,tencent_domain,real-ip
    - RULE-SET,bilibili_domain,real-ip
    - RULE-SET,alibaba_domain,real-ip
    - RULE-SET,bytedance_domain,real-ip
    - RULE-SET,cn_domain,real-ip
    - RULE-SET,google_domain,real-ip
    - RULE-SET,telegram_domain,real-ip
    - RULE-SET,microsoft_domain,real-ip
    - RULE-SET,geolocation-!cn_domain,real-ip
    - MATCH,fake-ip
  respect-rules: false
  use-hosts: true
  default-nameserver:
    - "https://223.5.5.5/dns-query#🇨🇳国内节点"
  nameserver:
    - "https://dns.alidns.com/dns-query#🇨🇳国内节点"
  proxy-server-nameserver:
    - "https://223.6.6.6/dns-query#🇨🇳国内节点"
  nameserver-policy:
    "rule-set:cn_domain,bytedance_domain,alibaba_domain,tencent_domain,bilibili_domain,xiaomi_domain":
      - "https://dns.alidns.com/dns-query#🇨🇳国内节点"
      - "https://doh.pub/dns-query#🇨🇳国内节点"
      - "tcp://123.123.123.123#🇨🇳国内节点"
    "rule-set:geolocation-!cn_domain,microsoft_domain,telegram_domain,google_domain":
      - "https://dns.google/dns-query#🇺🇳国外节点"
      - "https://cloudflare-dns.com/dns-query#🇺🇳国外节点"
      - "https://dns.quad9.net/dns-query#🇺🇳国外节点"
  fallback:
    - "https://dns.google/dns-query#🇺🇳国外节点"
proxies:
  - name: "直连"
    type: direct
    udp: true
  - name: "DNS_Hijack"
    type: dns
  - name: "云南"
    type: vmess
    server: 103.20.160.93
    port: 443
    uuid: a6dda9e8-19d3-4a3f-b8db-ec4d5da56efc
    alterId: 0
    cipher: auto
    network: ws
    ws-opts:
      path: /
      headers:
        Host: adashx.ut.dingtalk.com
  - name: "德国"
    type: vmess
    server: 189.24.97.235
    port: 10187
    uuid: b0ed12e4-d037-40f4-b078-d73e7cce2695
    alterId: 0
    cipher: auto
    network: ws
    ws-opts:
      path: /
      headers:
        Host: adashx.ut.dingtalk.com
  - name: "台湾"
    type: vmess
    server: 125.228.248.3
    port: 80
    uuid: a6dda9e8-19d3-4a3f-b8db-ec4d5da56efc
    alterId: 0
    cipher: auto
    network: http
    http-opts:
      method: "GET"
      path:
      - '/'
      headers:
        Host:
        - adashx.ut.dingtalk.com
proxy-groups:
  - name: 🇨🇳国内节点
    type: select
    proxies:
      - 云南
    default-selected: 云南

  - name: 🇺🇳国外节点
    type: select
    proxies:
      - 台湾
      - 德国
    default-selected: 台湾

rules:
  - DST-PORT,53,DNS_Hijack
  - RULE-SET,private_ip,直连,no-resolve
  - RULE-SET,xiaomi_domain,🇨🇳国内节点
  - RULE-SET,tencent_domain,🇨🇳国内节点
  - RULE-SET,bilibili_domain,🇨🇳国内节点
  - RULE-SET,alibaba_domain,🇨🇳国内节点
  - RULE-SET,bytedance_domain,🇨🇳国内节点
  - RULE-SET,cn_domain,🇨🇳国内节点
  - RULE-SET,cn_ip,🇨🇳国内节点,no-resolve
  - RULE-SET,google_domain,🇺🇳国外节点
  - RULE-SET,google_ip,🇺🇳国外节点,no-resolve
  - RULE-SET,telegram_domain,🇺🇳国外节点
  - RULE-SET,microsoft_domain,🇺🇳国外节点
  - RULE-SET,geolocation-!cn_domain,🇺🇳国外节点
  - MATCH,🇺🇳国外节点
  - MATCH,REJECT

rule-anchor:
  ip: &ip {type: http, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, behavior: domain, format: mrs}
rule-providers:
  cn_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"
  bytedance_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/bytedance.mrs"
  tencent_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/tencent.mrs"
  alibaba_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/alibaba.mrs"
  google_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.mrs"
  telegram_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.mrs"
  bilibili_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/bilibili.mrs"
  microsoft_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.mrs"
  xiaomi_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/xiaomi.mrs"
  geolocation-!cn_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs"


  private_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs"
  cn_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"
  google_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/google.mrs"